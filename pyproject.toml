[odoo]
version = 19.0
test_enabled = true
build_docker = false
edition = "enterprise"
git_hosts = ""

[tool.black]
line-length = 88
target-version = ['py37','py38']
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  | venv_*
  | folder_to_ignore_1
  | folder_to_ignore_2
)/
'''